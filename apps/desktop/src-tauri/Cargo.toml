[package]
name = "desktop"
version = "0.0.49"
description = ""
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
app-store = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focuscat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
png = "0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53.1", features = ["sync", "macros", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
# Git version required for `set_is_main_thread()` fix - crashes on macOS keyboard events without it.
# See: https://github.com/Narsil/rdev/issues/165
# TODO: Switch to crates.io version once 0.5.4+ is released with this fix.
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "c14f2dc" }
mado = "0.0.16"
focuscat-macos = { path = "../crates/macos" }
nucleo-matcher = "0.3.1"
rodio = "0.22.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
tauri-plugin-autostart = "2.5.1"
