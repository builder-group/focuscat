name: '🔍 CI'
description: 'Lint, build, and test the workspace'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Build workspace dependencies
      shell: bash
      run: pnpm exec turbo run build --filter='@repo/desktop^...' --filter='@repo/web^...'

    - name: Build desktop UI
      shell: bash
      run: pnpm --filter @repo/desktop ui:build

    - name: Build web
      shell: bash
      run: pnpm --filter @repo/web build

    - name: Test
      shell: bash
      run: pnpm test
