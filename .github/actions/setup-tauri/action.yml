name: '⚙️ Setup Tauri'
description: 'Install Rust toolchain and configure caching for Tauri builds'

inputs:
  targets:
    description: 'Rust targets to install (comma-separated)'
    required: false
    default: ''
  cargo-workspace:
    description: 'Cargo workspace root to cache'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        if [ -n "${{ inputs.targets }}" ]; then
          IFS=',' read -ra targets <<< "${{ inputs.targets }}"
          for target in "${targets[@]}"; do
            rustup target add "$target"
          done
        fi
        rustup show active-toolchain
        rustc --version --verbose

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cargo-workspace }} -> target
        cache-on-failure: true
