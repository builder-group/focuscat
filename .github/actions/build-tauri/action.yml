name: '📦 Build Tauri'
description: 'Build Tauri app for specific platform'

inputs:
  app:
    description: 'App name (e.g., desktop)'
    required: true
  app-directory:
    description: 'App directory path'
    required: true
  platform:
    description: 'Platform (e.g., macos-latest, windows-latest, ubuntu-22.04)'
    required: true
  target:
    description: 'Rust target (e.g., aarch64-apple-darwin)'
    required: true
  args:
    description: 'Additional Tauri build args'
    required: false
    default: ''
  config:
    description: 'Tauri config file (dev or prod)'
    required: false
    default: 'prod'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Setup Tauri
      uses: ./.github/actions/setup-tauri
      with:
        targets: ${{ inputs.target }}
        cargo-workspace: .

    - name: Build workspace dependencies
      shell: bash
      run: pnpm exec turbo run build --filter='@repo/${{ inputs.app }}^...'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Import Apple certificate (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        # Create certificate file
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
        
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        
        # Import certificate
        security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Build frontend
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      run: pnpm ui:build

    - name: Build Tauri app
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      env:
        APPLE_ID: ${{ env.APPLE_ID }}
        APPLE_PASSWORD: ${{ env.APPLE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        if [ "${{ inputs.config }}" = "prod" ]; then
          pnpm tauri build ${{ inputs.args }} --config src-tauri/tauri.prod.conf.json
        else
          pnpm tauri build ${{ inputs.args }}
        fi

    - name: Cleanup keychain (macOS)
      if: runner.os == 'macOS' && always()
      shell: bash
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        if [ -f "$KEYCHAIN_PATH" ]; then
          security delete-keychain $KEYCHAIN_PATH
        fi
